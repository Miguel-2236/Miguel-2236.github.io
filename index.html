<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>

<body>
    <div class="greetings">
        <span>A</span>
        <span>M</span>
        <span>O</span>
        <span>R</span>
        <span>!</span>
    </div>
    <div class="description">
        <span>¿TE GUSTARIA SER MI SAN VALENTIN ❤️?</span>
    </div>
    <div class="button">
        <button class="botones">
            <a href="flower.html" style="color: #fff;">SI</a>
        </button>
        <button class="botones">
            <a href="#" id="random-btn" style="color: #fff;">NO</a>
        </button>
    </div>
    <script>
        const NOP = document.getElementById("random-btn");

        const mover = () => {
            NOP.style.position = 'absolute';
            NOP.style.top = (Math.random()* window.innerHeight) + 'px';
            NOP.style.left = (Math.random()* window.innerWidth) + 'px';
        }

        NOP.addEventListener('mouseover', mover);
    </script>
</body>
</html>
